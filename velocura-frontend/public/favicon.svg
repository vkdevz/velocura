<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Precision Border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Background Ambient Glow Behind Mark -->
  <circle cx="256" cy="270" r="140" fill="#0A84FF" opacity="0.18" filter="url(#glow)" />

  <!-- VeloCura Pulse "V" Mark -->
  <g filter="url(#glow)">
    <!-- Continuous Velocity Pulse Wave forming V and ECG -->
    <path
      d="M 96 160
         L 170 330
         L 216 230
         L 246 370
         L 274 190
         L 304 290
         L 342 330
         L 416 160"
      fill="none"
      stroke="url(#primaryGrad)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Precision Medical Cross Header Badge -->
  <g transform="translate(256, 118)">
    <circle cx="0" cy="0" r="28" fill="url(#bgGrad)" stroke="url(#crossGrad)" stroke-width="4" />
    <rect x="-4" y="-14" width="8" height="28" rx="4" fill="url(#crossGrad)" />
    <rect x="-14" y="-4" width="28" height="8" rx="4" fill="url(#crossGrad)" />
  </g>
</svg>