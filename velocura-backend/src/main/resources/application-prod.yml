server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: velocura-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:${DB_URL}}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1200000}
      leak-detection-threshold: 60000
      pool-name: VeloCuraHikariPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
  h2:
    console:
      enabled: false

velocura:
  admin:
    email: ${ADMIN_EMAIL:admin@velocura.com}
    password: ${ADMIN_PASSWORD}
  payment:
    mock-enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.velocura: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
