server:
  port: ${PORT:8080}

spring:
  application:
    name: velocura-backend
  datasource:
    url: ${DB_URL:${DATABASE_URL:jdbc:h2:file:./velocura_db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

velocura:
  gemini:
    api-key: ${GEMINI_API_KEY:}
  admin:
    email: ${ADMIN_EMAIL:admin@velocura.com}
    password: ${ADMIN_PASSWORD:VeloCuraAdmin_#2026_SecureKey}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

